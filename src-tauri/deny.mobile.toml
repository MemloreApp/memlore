# cargo-deny policy for the mobile app (cargo-deny 0.20). Run through
# `scripts/license-check.sh --mobile`:
#   cargo deny --manifest-path src-tauri/crates/memlore-mobile-ffi/Cargo.toml --config src-tauri/deny.mobile.toml check licenses
# Same allowlist as deny.toml, minus AGPL-3.0-or-later: a third-party crate may
# not bring a copyleft licence into the mobile binary. The project's own crates
# are still skipped through `[licenses.private]` below.

[graph]
# Only the crates that reach the mobile targets (Android is M10).
targets = ["aarch64-apple-ios", "aarch64-linux-android"]
# Every optional feature counts: a licence pulled in only by a feature still ships
# in some build.
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# No `[[licenses.clarify]]` entries: every crate in the graph declares an SPDX
# expression. Add one only for a crate whose metadata lacks it, with a comment.

# The workspace's own crates (memlore-mobile-ffi, memlore-engine, memlore-core)
# are marked `publish = false`; skip them.
[licenses.private]
ignore = true

# Report only: `scripts/license-check.sh` runs `check licenses`, never `check advisories`.
[advisories]
version = 2

[bans]
multiple-versions = "allow"
