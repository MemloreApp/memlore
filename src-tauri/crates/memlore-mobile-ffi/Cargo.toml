[package]
name = "memlore-mobile-ffi"
version = "0.0.0"
description = "UniFFI bindings of memlore-engine for the Memlore mobile app"
license = "AGPL-3.0-or-later"
edition = "2021"
# TODO(later): MSRV not checked, see docs/LATER.md
rust-version = "1.99"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[features]
# Binding generation only (`src/bin/uniffi-bindgen.rs`); never part of the
# library graph that ships in the app.
uniffi-cli = ["uniffi/cli", "uniffi/cargo-metadata"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[dependencies]
# Proc-macro mode. `default-features = false` keeps `cargo_metadata` out of
# the static library; the bindgen turns it back on through `uniffi-cli`.
uniffi = { version = "=0.32.2", default-features = false }
# No `fastembed` on mobile. Never enable `test-support` here.
memlore-engine = { path = "../memlore-engine", default-features = false }
memlore-core = { path = "../memlore-core" }
# Own runtime for the engine's async code (`MemloreEngine::new`).
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
thiserror = "2"
log = "0.4"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
# Same version and features as memlore-engine (the hooks take a `Connection`).
rusqlite = { version = "0.34", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(target_os = "ios")'.dependencies]
# iOS Keychain backend for the biometric os_kek (same crate as the desktop).
security-framework = "3"

[dev-dependencies]
serde_json = "1.0"
base64 = "0.22"
yrs = "0.25"
tempfile = "3"
