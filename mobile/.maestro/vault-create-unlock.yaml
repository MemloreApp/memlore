# Lock-state E2E (plan phase 14.3): create the vault, relaunch, reject a wrong
# password, unlock.
#
# Runs against the Release simulator build, which embeds the JS bundle, so
# launchApp/stopApp need no Metro and no dev-client launcher:
#   pnpm mobile:ios:release   # once per native or JS change
#   pnpm mobile:e2e
# `pnpm mobile:ios` reinstalls the dev client (needs Metro); rebuild the
# Release app before running this flow again. clearState wipes the app's
# container, so the flow always starts on a fresh vault.
appId: app.memlore.mobile
---
- launchApp:
    clearState: true

# First launch: create the vault.
- tapOn:
    id: password-input
- inputText: "12345678"
- tapOn:
    id: confirm-password-input
- inputText: "12345678"
- tapOn:
    id: create-vault-button
- extendedWaitUntil:
    visible:
      id: recovery-phrase
    timeout: 30000
- tapOn:
    id: phrase-saved-button
- extendedWaitUntil:
    visible:
      id: entry-count
    timeout: 15000

# Relaunch: the vault is locked.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: unlock-button
    timeout: 15000

# A wrong password is rejected.
- tapOn:
    id: password-input
- inputText: "wrong-password"
- tapOn:
    id: unlock-button
- extendedWaitUntil:
    visible:
      id: vault-error
    timeout: 30000
- assertNotVisible:
    id: entry-count

# The right one unlocks.
- tapOn:
    id: password-input
- inputText: "12345678"
- tapOn:
    id: unlock-button
- extendedWaitUntil:
    visible:
      id: entry-count
    timeout: 30000
