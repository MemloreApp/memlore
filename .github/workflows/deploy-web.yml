name: Deploy Web Companion

# Ships web.memlore.app. The web companion has its own version (web/version.json)
# and its own tags, `web-v<semver>`, cut by `/cf-ship --web`. Desktop tags stay
# `v*`; `web-v*` never matches release.yml's `refs/tags/v*` guard.
#
# Default web deploys do not use this workflow: `/cf-ship --web` builds and
# deploys from the tag commit on the local Mac with
# .coding-friend/skills/cf-ship-custom/scripts/deploy-web-local.sh. This
# workflow is the `/cf-ship --cloud` path. Pushing a tag starts nothing.
#
# - pull_request:      test + build only, never deploys.
# - workflow_dispatch: test + build, then deploy to production, started on an
#                      existing tag with `gh workflow run deploy-web.yml --ref
#                      web-v<version>`. Must be a stable web-v* tag ref, never a
#                      branch; prereleases are discontinued, so a tag containing
#                      `-` is refused.
#
# After a deploy, the `release` job publishes a GitHub Release for the web tag
# with its CHANGELOG.md section as notes, always `--latest=false`: the desktop
# updater's stable channel, the website download and the stats worker all read
# /releases/latest, which must stay on the desktop release. It is skipped while
# the latest desktop release is older than v0.2.6: builds up to v0.2.5 resolve
# their beta setting from the single newest release and reject a web-v* tag;
# v0.2.6 has no beta setting. Same rule as deploy-web-local.sh
# (MIN_DESKTOP_FOR_WEB_RELEASES). A user still on v0.2.5 or older with beta
# selected sees an update only while a v* release is the newest one, until they
# update once or switch to stable; accepted on purpose.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/**'
      - 'workers/web-auth/**'
      - 'src-tauri/crates/memlore-core/**'
      - 'src-tauri/crates/memlore-wasm/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test Web Companion
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      worker_changed: ${{ steps.release.outputs.worker_changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The previous web tag is needed to tell whether the Worker changed.
          fetch-depth: 0

      # A deploy must come from a web-v* tag whose version matches web/version.json,
      # so what is live is always a tagged, versioned build.
      - name: Check the web release tag
        id: release
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF_NAME#web-v}" = "${GITHUB_REF_NAME}" ]; then
            echo "::error::Deploys run only from a web-v* tag (got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'). Dispatch on a tag: gh workflow run deploy-web.yml --ref web-v<version>."
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#web-v}"
          FILE_VERSION="$(node -p "require('./web/version.json').version")"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match web/version.json (${FILE_VERSION})."
            exit 1
          fi
          case "$TAG_VERSION" in
            *-*)
              echo "::error::Prereleases are discontinued (got ${GITHUB_REF_NAME}). Ship a stable web-vX.Y.Z tag."
              exit 1
              ;;
          esac
          # The previous web tag reachable from this commit's parent. None means the
          # first web release, which deploys the Worker too.
          PREV="$(git describe --tags --abbrev=0 --match 'web-v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -z "$PREV" ] || ! git diff --quiet "$PREV" "$GITHUB_SHA" -- workers/web-auth; then
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker_changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Web ${TAG_VERSION}: previous tag ${PREV:-none}"

      # A tag can point at any commit, including one never merged to main. Prove
      # the tagged commit is on main before any step that reads a secret.
      - name: Require the tagged commit to be on main
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from main. Deploy only tags cut on main."
            exit 1
          fi
          echo "${GITHUB_SHA} is on main"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        id: cache-wasm-bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.118-${{ runner.os }}

      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version =0.2.118 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Web tests
        run: pnpm web:test

      - name: Run Desktop outbox golden tests
        run: cd src-tauri && cargo test golden_

      - name: Build Web production assets
        run: pnpm web:build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy web/dist --project-name memlore-web --branch main --commit-message "$GITHUB_REF_NAME"

  deploy-worker:
    name: Deploy Auth Worker
    needs: [build-and-test]
    # Only when workers/web-auth changed since the previous web tag: every
    # deploy re-applies wrangler.toml, including WEB_WRITES_ENABLED.
    if: >-
      github.event_name != 'pull_request' &&
      needs.build-and-test.outputs.worker_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Auth Worker
        working-directory: workers/web-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

  release:
    name: GitHub Release
    # After the Worker too, when it deploys: a failed Worker deploy must not
    # leave a published release behind (deploy-web-local.sh stops there too).
    needs: [build-and-test, deploy-worker]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.build-and-test.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.deploy-worker.result)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job writes; the build job keeps its read-only token.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish the web release
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_DESKTOP: v0.2.6
        run: |
          set -euo pipefail
          # Unreadable is a skip, not a failure: the deploy already succeeded.
          LATEST="$(gh release view --json tagName --jq .tagName)" || {
            echo "::warning::Release skipped: could not read the latest desktop release."
            exit 0
          }
          if [ "$(printf '%s\n%s\n' "$MIN_DESKTOP" "$LATEST" | sort -V | head -1)" != "$MIN_DESKTOP" ]; then
            echo "::warning::Release skipped: latest desktop release is $LATEST, older than $MIN_DESKTOP."
            exit 0
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — left as is"
            exit 0
          fi
          bash scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
            --title "Memlore Web ${GITHUB_REF_NAME#web-v}" --notes-file "$RUNNER_TEMP/notes.md"
